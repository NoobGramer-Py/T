<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>T — ULTRON CORE HOLOGRAM</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100vw; height: 100vh;
    background: transparent;
    overflow: hidden;
    user-select: none;
    font-family: 'Share Tech Mono', monospace;
  }

  #drag-region {
    position: fixed; inset: 0;
    -webkit-app-region: drag;
    app-region: drag;
  }

  canvas {
    position: fixed; top: 0; left: 0;
    width: 100vw; height: 100vh;
    -webkit-app-region: no-drag;
    app-region: no-drag;
  }

  #close-btn {
    position: fixed; top: 14px; right: 16px;
    width: 26px; height: 26px;
    background: rgba(255, 0, 51, 0.08);
    border: 1px solid rgba(255, 0, 51, 0.25);
    border-radius: 2px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    color: rgba(255, 0, 51, 0.7);
    font-size: 11px;
    z-index: 100;
    -webkit-app-region: no-drag;
    app-region: no-drag;
    opacity: 0;
    transition: all 0.2s ease;
  }
  body:hover #close-btn { opacity: 1; }
  #close-btn:hover {
    background: rgba(255, 0, 51, 0.3);
    border-color: #ff0033;
    color: #ffffff;
    box-shadow: 0 0 12px rgba(255, 0, 51, 0.6);
  }

  #t-label {
    position: fixed; top: 18px; left: 20px;
    font-family: 'Orbitron', sans-serif;
    font-size: 12px; font-weight: 900; letter-spacing: 8px;
    color: #ff0033;
    z-index: 100; pointer-events: none;
    text-shadow: 0 0 14px rgba(255, 0, 51, 0.8), 0 0 30px rgba(255, 0, 51, 0.4);
    display: flex; align-items: center; gap: 8px;
  }
  #t-label::after {
    content: 'CORE AI';
    font-size: 7px; letter-spacing: 4px; color: rgba(255, 255, 255, 0.4);
    font-family: 'Share Tech Mono', monospace;
  }

  #status-row {
    position: fixed; bottom: 24px;
    left: 0; right: 0;
    display: flex; flex-direction: column;
    align-items: center; gap: 8px;
    z-index: 100; pointer-events: none;
  }

  #status-text {
    font-family: 'Orbitron', sans-serif;
    font-size: 10px; font-weight: 700; letter-spacing: 8px;
    color: #ff0033;
    text-shadow: 0 0 14px rgba(255, 0, 51, 0.7);
    transition: color 0.4s ease, text-shadow 0.4s ease;
  }

  #data-row {
    display: flex; gap: 24px; align-items: center;
    background: rgba(10, 8, 14, 0.65);
    padding: 6px 18px;
    border: 1px solid rgba(255, 0, 51, 0.15);
    border-radius: 2px;
    backdrop-filter: blur(8px);
  }

  .data-item {
    display: flex; flex-direction: column;
    align-items: center; gap: 2px;
  }

  .data-value {
    font-size: 11px; color: rgba(255, 255, 255, 0.9);
    font-variant-numeric: tabular-nums;
    letter-spacing: 2px;
  }

  .data-label {
    font-size: 6px; letter-spacing: 4px;
    color: rgba(255, 0, 51, 0.6);
  }

  .sep {
    width: 2px; height: 12px;
    background: rgba(255, 0, 51, 0.2);
  }

  /* Corner brackets */
  .bracket {
    position: fixed; width: 20px; height: 20px;
    pointer-events: none; opacity: 0.4;
  }
  .bracket.tl { top: 10px;  left: 10px;
    border-top: 1px solid #ff0033; border-left: 1px solid #ff0033; }
  .bracket.tr { top: 10px;  right: 10px;
    border-top: 1px solid #ff0033; border-right: 1px solid #ff0033; }
  .bracket.bl { bottom: 10px; left: 10px;
    border-bottom: 1px solid #ff0033; border-left: 1px solid #ff0033; }
  .bracket.br { bottom: 10px; right: 10px;
    border-bottom: 1px solid #ff0033; border-right: 1px solid #ff0033; }

  #scanline {
    position: fixed; left: 0; right: 0; height: 2px;
    background: linear-gradient(to right,
      transparent, rgba(255, 0, 51, 0.1) 30%,
      rgba(255, 0, 51, 0.4) 50%,
      rgba(255, 0, 51, 0.1) 70%, transparent);
    pointer-events: none;
    animation: sweep 8s linear infinite;
    z-index: 50;
  }
  @keyframes sweep { 0% { top: -2px; } 100% { top: 100vh; } }
</style>
</head>
<body>

<div id="drag-region" data-tauri-drag-region></div>

<div class="bracket tl"></div>
<div class="bracket tr"></div>
<div class="bracket bl"></div>
<div class="bracket br"></div>

<div id="scanline"></div>
<canvas id="c"></canvas>

<div id="t-label">ULTRON</div>
<div id="close-btn" onclick="closeWindow()">✕</div>

<div id="status-row">
  <div id="status-text">SYSTEM IDLE</div>
  <div id="data-row">
    <div class="data-item">
      <span class="data-value" id="val-time">--:--:--</span>
      <span class="data-label">CHRONO</span>
    </div>
    <div class="sep"></div>
    <div class="data-item">
      <span class="data-value" id="val-uptime">0s</span>
      <span class="data-label">UPTIME</span>
    </div>
    <div class="sep"></div>
    <div class="data-item">
      <span class="data-value" id="val-status" style="color: #ff0033;">ONLINE</span>
      <span class="data-label">STATE</span>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
async function closeWindow() {
  try {
    const { getCurrentWindow } = await import('https://unpkg.com/@tauri-apps/api@2/window.js');
    await getCurrentWindow().close();
  } catch { window.close(); }
}

// ── Interaction State Config ────────────────────────────────────────────────
let mode    = 'idle';
let startTs = Date.now();
const statusEl = document.getElementById('status-text');

const STATE_CONFIGS = {
  idle:          { label: 'SYSTEM IDLE',     color: '#ff0033', speed: 1.0,  pulseFreq: 1.2 },
  listening:     { label: 'VOICE INGESTION', color: '#ffffff', speed: 2.2,  pulseFreq: 3.5 },
  understanding: { label: 'DECODING PATTERN',color: '#ff3355', speed: 1.8,  pulseFreq: 2.5 },
  reasoning:     { label: 'NEURAL REASONING',color: '#ff0033', speed: 2.8,  pulseFreq: 4.0 },
  planning:      { label: 'PLANNING PATH',   color: '#d8e0e6', speed: 2.0,  pulseFreq: 2.0 },
  executing:     { label: 'EXECUTING ACTION',color: '#ff0033', speed: 3.5,  pulseFreq: 5.0 },
  speaking:      { label: 'AUDIO BROADCAST', color: '#ffffff', speed: 3.0,  pulseFreq: 4.5 },
  waiting:       { label: 'AWAITING RESPONSE',color: '#800016',speed: 0.7,  pulseFreq: 0.8 },
  error:         { label: 'CRITICAL ANOMALY',color: '#ff0000', speed: 4.0,  pulseFreq: 8.0 },
  offline:       { label: 'CORE DISCONNECTED',color:'#555566', speed: 0.2,  pulseFreq: 0.4 },
  updating:      { label: 'SYNCHRONIZING',   color: '#a0aab0', speed: 2.5,  pulseFreq: 3.0 },
  learning:      { label: 'WEIGHT ADAPTATION',color: '#ffffff', speed: 2.8,  pulseFreq: 3.8 },
};

setInterval(() => {
  try {
    const m = localStorage.getItem('t_visualizer_mode') || 'idle';
    if (m !== mode) {
      mode = m;
      const conf = STATE_CONFIGS[m] || STATE_CONFIGS.idle;
      if (statusEl) {
        statusEl.textContent = conf.label;
        statusEl.style.color = conf.color;
        statusEl.style.textShadow = `0 0 16px ${conf.color}`;
      }
    }
  } catch {}
}, 200);

// ── Tickers ──────────────────────────────────────────────────────────────────
setInterval(() => {
  const now = new Date();
  document.getElementById('val-time').textContent = now.toTimeString().slice(0,8);
  const secs = Math.floor((Date.now() - startTs) / 1000);
  const mins = Math.floor(secs / 60);
  const hrs  = Math.floor(mins / 60);
  document.getElementById('val-uptime').textContent =
    hrs > 0 ? `${hrs}h ${mins%60}m` : mins > 0 ? `${mins}m ${secs%60}s` : `${secs}s`;
}, 1000);

// ── Three.js Ultron Consciousness Rendering ──────────────────────────────────
const canvas   = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setClearColor(0x000000, 0);

const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 200);
camera.position.z = 7.5;

function resize() {
  const W = window.innerWidth, H = window.innerHeight;
  renderer.setSize(W, H);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  camera.aspect = W / H;
  camera.updateProjectionMatrix();
}
resize();
window.addEventListener('resize', resize);

// Ultron Color Tokens in WebGL
const C_RED    = 0xff0033;
const C_CRIM   = 0x800016;
const C_WHITE  = 0xffffff;
const C_SILVER = 0xa0aab0;
const C_DARK   = 0x2a0008;

const M = (color, opacity, side = THREE.FrontSide) =>
  new THREE.MeshBasicMaterial({
    color, transparent: true, opacity, side,
    blending: THREE.AdditiveBlending, depthWrite: false,
  });

// 1. Inner Core Nucleus (Glowing sphere + Geodesic Inner Cage)
const innerNucleus = new THREE.Mesh(new THREE.SphereGeometry(0.35, 32, 32), M(C_WHITE, 0.75));
scene.add(innerNucleus);

const outerNucleusGlow = new THREE.Mesh(new THREE.SphereGeometry(0.7, 32, 32), M(C_RED, 0.15, THREE.BackSide));
scene.add(outerNucleusGlow);

const geoMesh = new THREE.Mesh(new THREE.IcosahedronGeometry(0.75, 2), M(C_RED, 0.6));
geoMesh.material.wireframe = true;
scene.add(geoMesh);

const outerIcoMesh = new THREE.Mesh(new THREE.IcosahedronGeometry(1.05, 1), M(C_SILVER, 0.3));
outerIcoMesh.material.wireframe = true;
scene.add(outerIcoMesh);

// 2. Orbital Laser Rings & Wireframe Discs
const RINGS = [
  { r: 1.30, tube: 0.012, col: C_WHITE, spd:  0.8, tilt: [0, 0, 0] },
  { r: 1.65, tube: 0.008, col: C_RED,   spd: -0.5, tilt: [Math.PI/4, 0, 0] },
  { r: 2.05, tube: 0.006, col: C_CRIM,  spd:  0.4, tilt: [Math.PI/3, Math.PI/6, 0] },
  { r: 2.50, tube: 0.009, col: C_RED,   spd: -0.3, tilt: [Math.PI*0.6, 0, 0] },
  { r: 2.95, tube: 0.005, col: C_SILVER,spd:  0.2, tilt: [Math.PI*0.8, Math.PI/4, 0] },
];

const ringGroups = RINGS.map(({ r, tube, col, spd, tilt }) => {
  const pivot = new THREE.Group();
  pivot.rotation.set(...tilt);
  pivot.add(new THREE.Mesh(new THREE.TorusGeometry(r, tube, 12, 120), M(col, 0.85)));
  pivot.add(new THREE.Mesh(new THREE.TorusGeometry(r, tube * 8, 8, 120), M(col, 0.04)));
  scene.add(pivot);
  return { pivot, spd };
});

// 3. Orbital Scanning Particle Cloud (1200+ particles)
const PC    = 1200;
const pArr  = new Float32Array(PC * 3);
const pData = Array.from({ length: PC }, () => ({
  orb:   1.1 + Math.random() * 2.8,
  ang:   Math.random() * Math.PI * 2,
  spd:   (0.1 + Math.random() * 0.5) * (Math.random() > 0.5 ? 1 : -1),
  phase: Math.random() * Math.PI * 2,
  amp:   0.1 + Math.random() * 0.35,
}));
const pGeo  = new THREE.BufferGeometry();
pGeo.setAttribute('position', new THREE.BufferAttribute(pArr, 3));
const pMesh = new THREE.Points(pGeo, new THREE.PointsMaterial({
  color: C_RED, size: 0.025, transparent: true, opacity: 0.75,
  blending: THREE.AdditiveBlending, depthWrite: false,
}));
scene.add(pMesh);

// 4. Volumetric Energy Pulse Rings
const pulses = [];
let pulseTimer = 0;
function spawnPulse() {
  const m = new THREE.Mesh(new THREE.TorusGeometry(0.75, 0.012, 8, 64), M(C_RED, 0.8));
  scene.add(m);
  pulses.push({ mesh: m, scale: 1.0, opacity: 0.8 });
}

// ── Animation Loop ───────────────────────────────────────────────────────────
let last = 0, rotX = 0, rotY = 0;

function tick(ts) {
  requestAnimationFrame(tick);
  const t  = ts * 0.001;
  const dt = Math.min(t - last, 0.05);
  last = t;

  const conf  = STATE_CONFIGS[mode] || STATE_CONFIGS.idle;
  const speed = conf.speed;

  // Rotations
  rotX += dt * 0.2 * speed;
  rotY += dt * 0.35 * speed;

  geoMesh.rotation.set(rotX, rotY, 0);
  outerIcoMesh.rotation.set(-rotX * 0.6, -rotY * 0.4, rotX * 0.2);

  // Core Pulsing
  const breathe = 1 + Math.sin(t * conf.pulseFreq) * 0.06 * speed;
  geoMesh.scale.setScalar(breathe);
  innerNucleus.scale.setScalar(0.9 + Math.sin(t * conf.pulseFreq * 2) * 0.12);

  // Rings
  ringGroups.forEach(({ pivot, spd }, i) => {
    pivot.rotation.z += spd * dt * speed;
    pivot.scale.setScalar(1 + Math.sin(t * 3 + i) * 0.03 * speed);
  });

  // Particles Orbiting
  for (let i = 0; i < PC; i++) {
    const p = pData[i];
    p.ang += p.spd * dt * speed;
    pArr[i*3]   = Math.cos(p.ang) * p.orb;
    pArr[i*3+1] = Math.sin(p.ang * 0.6 + p.phase) * p.orb * p.amp;
    pArr[i*3+2] = Math.sin(p.ang) * p.orb;
  }
  pGeo.attributes.position.needsUpdate = true;

  // Energy Pulses
  pulseTimer += dt;
  if (pulseTimer >= (2.0 / speed)) {
    pulseTimer = 0;
    spawnPulse();
  }
  for (let i = pulses.length - 1; i >= 0; i--) {
    const p = pulses[i];
    p.scale   += dt * 2.2 * speed;
    p.opacity -= dt * 0.6 * speed;
    p.mesh.scale.setScalar(p.scale);
    p.mesh.material.opacity = Math.max(0, p.opacity);
    if (p.opacity <= 0) {
      scene.remove(p.mesh);
      p.mesh.geometry.dispose();
      p.mesh.material.dispose();
      pulses.splice(i, 1);
    }
  }

  // Error glitch mode jitter
  if (mode === 'error') {
    camera.position.x = (Math.random() - 0.5) * 0.15;
    camera.position.y = (Math.random() - 0.5) * 0.15;
  } else {
    camera.position.x = 0;
    camera.position.y = 0;
  }

  renderer.render(scene, camera);
}
requestAnimationFrame(tick);
</script>
</body>
</html>
